<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <title>ReDrop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0.7) 100%), 
                        url('./bg.jpg') center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        /* Language Dropdown */
        .language-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
        }

       .language-selector select {
        padding: 8px 15px;
        border: 2px solid white;
        border-radius: 5px;
        background: transparent;   /* ✅ removes gray box */
        color: white;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.3s ease;
        }

        .language-selector select:hover {
           background: transparent;
        }

        .language-selector select option {
            background-color: #222;
         
        }

        /* Main Content */
        .content {
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 7rem;
            color: white;
            margin-bottom: 15px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .description {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* Buttons */
        .buttons-container {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 14px 30px;
            font-size: 1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            background-color: #808080;
            color: white;
        }

        .btn:hover {
            background-color: #000000;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-primary {
            background-color: #808080;
            color: white;
        }

        .btn-primary:hover {
            background-color: #000000;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-secondary {
            background-color: #808080;
            color: white;
            border: none;
        }

        .btn-secondary:hover {
            background-color: #000000;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        /* Social Icons */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        .social-icon {
            width: 50px;
            height: 50px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            text-decoration: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .social-icon:hover {
            background-color: white;
            color: #667eea;
            transform: translateY(-5px);
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }

            .description {
                font-size: 1rem;
            }

            .buttons-container {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .language-selector {
                top: 10px;
                right: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Language Selector -->
    <div class="language-selector">
        <select id="languageSelect" onchange="changeLanguage()">
            <option value="en" selected>EN</option>
            <option value="de">DE</option>
            <option value="fr">FR</option>
            <option value="tr">TR</option>
            <option value="ru">RU</option>
            <option value="ar">AR</option>
        </select>
    </div>

    <!-- Main Container -->
    <div class="container">
        <div class="content">
            <!-- Main Title -->
            <h1 id="mainTitle">ReDrop</h1>

            <!-- Description -->
            <p class="description" id="description">
                Sharing - fast, independent, neighbourhood-binding
            </p>

            <!-- Buttons -->
            <div class="buttons-container">
                <a href="#" class="btn btn-primary" id="btn1Text" onclick="openSurvey1(); return false;">
                    Customer Survey
                </a>
                <a href="#" class="btn btn-secondary" id="btn2Text" onclick="openSurvey2(); return false;">
                    Partner Survey
                </a>
            </div>

            <!-- Social Links -->
            <div class="social-links">
                <a href="https://www.instagram.com/redrop_berlin?igsh=Yng5NjVuZHIwbnN4" class="social-icon" id="instagramLink" title="Follow us on Instagram" target="_blank">
                    <i class="fab fa-instagram"></i>
                </a>
            </div>
        </div>
    </div>

    <script>
        // Replace these with your actual Google Forms survey links
        const SURVEY_LINKS = {
            survey1: 'https://docs.google.com/forms/d/YOUR_SURVEY_1_ID/viewform',
            survey2: 'https://docs.google.com/forms/d/YOUR_SURVEY_2_ID/viewform'
        };

        // Replace with your Instagram profile URL
        const INSTAGRAM_URL = 'https://www.instagram.com/redrop_berlin?igsh=Yng5NjVuZHIwbnN4';

        // Translations
        const translations = {
            en: {
                mainTitle: 'ReDrop',
                description: 'Sharing - fast, independent, neighbourhood-binding',
                btn1: 'Customer Survey',
                btn2: 'Partner Survey'
            },
            de: {
                mainTitle: 'ReDrop',
                description: 'Sharing - fast, independent, neighbourhood-binding',
                btn1: 'Kundenumfrage',
                btn2: 'Partnerumfrage'
            },
            fr: {
                mainTitle: 'ReDrop',
                description: 'Sharing - fast, independent, neighbourhood-binding',
                btn1: 'Sondage Client',
                btn2: 'Sondage Partenaire'
            },
            tr: {
                mainTitle: 'ReDrop',
                description: 'Sharing - fast, independent, neighbourhood-binding',
                btn1: 'Müşteri Anketi',
                btn2: 'İş Ortağı Anketi'
            },
            ru: {
                mainTitle: 'ReDrop',
                description: 'Sharing - fast, independent, neighbourhood-binding',
                btn1: 'Опрос Клиентов',
                btn2: 'Опрос Партнеров'
            },
            ar: {
                mainTitle: 'ReDrop',
                description: 'Sharing - fast, independent, neighbourhood-binding',
                btn1: 'استطلاع العملاء',
                btn2: 'استطلاع الشركاء'
            }
        };

        // Change language function
        function changeLanguage() {
            const selectedLang = document.getElementById('languageSelect').value;
            const lang = translations[selectedLang];

            document.getElementById('mainTitle').textContent = lang.mainTitle;
            document.getElementById('description').textContent = lang.description;
            document.getElementById('btn1Text').textContent = lang.btn1;
            document.getElementById('btn2Text').textContent = lang.btn2;

            // Set page language attribute
            document.documentElement.lang = selectedLang;
            if (selectedLang === 'ar') {
                document.body.style.direction = 'rtl';
            } else {
                document.body.style.direction = 'ltr';
            }

            // Save language preference
            localStorage.setItem('preferredLanguage', selectedLang);
        }

        // Open survey 1
        function openSurvey1() {
            window.open(SURVEY_LINKS.survey1, '_blank');
        }

        // Open survey 2
        function openSurvey2() {
            window.open(SURVEY_LINKS.survey2, '_blank');
        }

        // Set Instagram link
        function setInstagramLink(url) {
            document.getElementById('instagramLink').href = url;
        }

        // Load saved language preference on page load
        window.addEventListener('load', function() {
            const savedLang = localStorage.getItem('preferredLanguage') || 'en';
            document.getElementById('languageSelect').value = savedLang;
            changeLanguage();
            setInstagramLink(INSTAGRAM_URL);
        });
    </script>
</body>
</html>
